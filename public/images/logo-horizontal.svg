<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 130" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&amp;family=Rajdhani:wght@700&amp;display=swap');
      
      .nav-brand-title {
        font-family: 'Rajdhani', 'Cinzel', 'Arial Black', sans-serif;
        font-weight: 700;
        font-size: 35px;
        fill: #000000;
        letter-spacing: 1.8px;
      }
      
      .nav-brand-line {
        stroke: #000000;
        stroke-width: 2.8;
        stroke-linecap: square;
      }
      
      .nav-brand-tagline {
        font-family: 'Playfair Display', 'Georgia', serif;
        font-style: italic;
        font-weight: 600;
        font-size: 24px;
        fill: #e88b23;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Left Emblem -->
  <g transform="translate(-10, -18) scale(0.24)">
    <path d="M 155,165 C 215,195 260,250 288,340 L 300,520 C 285,470 260,400 232,350 C 200,290 170,230 155,165 Z" fill="#000000" />
    <path d="M 268,235 C 288,255 305,275 320,335 L 425,130 C 385,210 345,310 320,460 C 305,400 288,320 268,235 Z" fill="#e88b23" />
  </g>

  <!-- Text Group -->
  <g transform="translate(108, 0)">
    <text x="0" y="52" class="nav-brand-title">VISHNU BUILDERR</text>
    <line x1="0" y1="67" x2="408" y2="67" class="nav-brand-line" />
    <text x="4" y="102" class="nav-brand-tagline">We Engineer Your Dreams</text>
  </g>
</svg>
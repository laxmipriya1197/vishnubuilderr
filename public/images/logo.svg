<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800&amp;family=Playfair+Display:ital,wght@1,600&amp;family=Rajdhani:wght@700&amp;display=swap');
      
      .brand-title {
        font-family: 'Rajdhani', 'Orbitron', 'Cinzel', 'Arial Black', sans-serif;
        font-weight: 700;
        font-size: 46px;
        fill: #000000;
        letter-spacing: 2px;
        text-anchor: middle;
      }
      
      .brand-line {
        stroke: #000000;
        stroke-width: 3.5;
        stroke-linecap: square;
      }
      
      .brand-tagline {
        font-family: 'Playfair Display', 'Georgia', serif;
        font-style: italic;
        font-weight: 600;
        font-size: 34px;
        fill: #e88b23;
        letter-spacing: 0.5px;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Checkmark Emblem -->
  <g transform="translate(0, -10)">
    <!-- Black Left Wing -->
    <path d="M 155,165 
             C 215,195 260,250 288,340 
             L 300,520 
             C 285,470 260,400 232,350 
             C 200,290 170,230 155,165 Z" 
          fill="#000000" />
          
    <!-- Orange Right Wing -->
    <path d="M 268,235 
             C 288,255 305,275 320,335 
             L 425,130 
             C 385,210 345,310 320,460 
             C 305,400 288,320 268,235 Z" 
          fill="#e88b23" />
  </g>

  <!-- Main Text -->
  <text x="300" y="445" class="brand-title">VISHNU BUILDERR</text>

  <!-- Separator Line -->
  <line x1="45" y1="468" x2="555" y2="468" class="brand-line" />

  <!-- Tagline -->
  <text x="300" y="525" class="brand-tagline">We Engineer Your Dreams</text>
</svg>